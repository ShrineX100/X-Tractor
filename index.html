<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Tractor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%239D7FE0' stroke='%23111111' stroke-width='4'/%3E%3Cg transform='translate(15,15) scale(1.45)'%3E%3Cpath d='M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.74l7.73-8.835L1.254 2.25H8.08l4.261 5.635L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z' fill='%23111111'/%3E%3C/g%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          cream: '#FFF8EA',
          ink: '#111111',
          orange: '#FF7A33',
          yellow: '#FFD54F',
          purple: '#9D7FE0',
          mint: '#8CE0C9',
          pink: '#FF99AA',
          blue: '#7EC6F2'
        },
        boxShadow: {
          'brutal-sm': '3px 3px 0 0 #111111',
          'brutal': '5px 5px 0 0 #111111',
          'brutal-lg': '8px 8px 0 0 #111111',
          'brutal-window': '10px 10px 0 0 #111111'
        }
      }
    }
  }
</script>
<style>
  :root { --bg:#FFF8EA; --card:#FFF8EA; --ink:#111111; --ink-inv:#FFF8EA; }
  html.dark { --bg:#161616; --card:#1F1F1F; --ink:#FFF8EA; --ink-inv:#111111; }
  body { background-color: var(--bg); transition: background-color .2s; }

  .toggle-wrap { position: fixed; top: 20px; right: 20px; z-index: 50; }
  .theme-btn {
    width: 48px; height: 48px; background: var(--card); border: 3px solid var(--ink);
    border-radius: 14px; box-shadow: 3px 3px 0 0 var(--ink); display: flex;
    align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
    transition: transform .15s, background-color .2s, border-color .2s;
  }
  .theme-btn:hover { transform: translateY(-2px); }
  .theme-btn i { font-size: 20px; }

  html.dark .card, html.dark .rc { background: var(--card) !important; border-color: var(--ink) !important; color: var(--ink); }
  html.dark .hdr h1, html.dark .hdr p { color: var(--ink); }
  html.dark input#url { background: var(--card); color: var(--ink); border-color: var(--ink); }
  html.dark input#url::placeholder { color: rgba(255,248,234,0.4); }
  html.dark .fbtn, html.dark .pbtn { border-color: var(--ink); color: var(--ink); }
  html.dark .foot { color: rgba(255,248,234,0.6); }
  html.dark .card .text-ink,
  html.dark .rc .text-ink,
  html.dark .card [class*="text-ink/"],
  html.dark .rc [class*="text-ink/"] { color: var(--ink) !important; }
  html.dark .rc .text-ink\/60 { color: rgba(255,248,234,0.6) !important; }
  html.dark .rc .text-ink\/70 { color: rgba(255,248,234,0.7) !important; }
  html.dark .rc .text-ink\/80 { color: rgba(255,248,234,0.8) !important; }
  html.dark .rc a.bg-yellow { color: #111111 !important; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  
  .ttext { 
    display: -webkit-box; 
    -webkit-line-clamp: 3; 
    -webkit-box-orient: vertical; 
    overflow: hidden; 
  }
  
  .qp {
    background: var(--card); color: var(--ink); border: 3px solid var(--ink);
    border-radius: 12px; box-shadow: 3px 3px 0 0 var(--ink);
    padding: 12px; text-align: left; font-weight: 900;
    transition: transform 0.15s, background-color 0.15s; cursor: pointer;
    min-width: 110px; display: flex; flex-direction: column; gap: 4px;
  }
  .qp:hover { transform: translateY(-2px); background: #FFD54F; color: #111111; }
  .qp.act { background: #9D7FE0; color: #FFF8EA; }
  .qp.act:hover { background: #9D7FE0; }
  .qp-bot { color: rgba(17,17,17,0.6); font-size: 11px; font-weight: 800; }
  .qp.act .qp-bot { color: rgba(255,248,234,0.8); }
  html.dark .qp-bot { color: rgba(255,248,234,0.6); }

  .spin { display: inline-block; width: 16px; height: 16px; border: 3px solid rgba(128,128,128,0.3); border-top-color: currentColor; border-radius: 50%; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  
  .fi { animation: fi .3s ease }
  @keyframes fi { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
</style>
<base target="_blank">
</head>
<body class="font-sans text-ink">

<div class="toggle-wrap">
  <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">
    <i class="ti ti-moon" id="themeIcon"></i>
  </button>
</div>

<h2 class="sr-only">X (Twitter) video downloader — paste a tweet URL to extract and download the video</h2>

<div class="wrap min-h-screen w-full flex flex-col items-center px-4 py-10 md:py-14">
  
  <!-- Header -->
  <div class="hdr fi text-center mb-10 rotate-[-2deg]">
    <div class="w-16 h-16 bg-purple border-[3px] border-ink rounded-[18px] shadow-brutal-sm flex items-center justify-center mx-auto mb-4 transition hover:-translate-y-1 hover:shadow-brutal cursor-pointer">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="#111111"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.74l7.73-8.835L1.254 2.25H8.08l4.261 5.635L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </div>
    <h1 class="text-3xl md:text-4xl font-black tracking-[-0.065em] text-ink">X-Tractor</h1>
    <p class="font-extrabold text-ink/70 mt-2 text-sm">Paste a link and it Sinks !</p>
  </div>

  <!-- Input Card -->
  <div class="card fi w-full max-w-xl bg-cream border-[3px] border-ink rounded-[20px] shadow-brutal-lg p-5 mb-6 rotate-[1deg] hover:rotate-0 transition-transform duration-300">
    <div class="flex gap-3 mb-4">
      <div class="relative flex-1">
        <i class="ti ti-link absolute left-4 top-1/2 -translate-y-1/2 text-ink/60 text-xl pointer-events-none"></i>
        <input type="text" id="url" placeholder="https://x.com/user/status/..." autocomplete="off" spellcheck="false" 
          class="w-full bg-cream border-[3px] border-ink rounded-[12px] py-3 pl-12 pr-10 text-ink font-bold placeholder-ink/40 focus:outline-none focus:ring-4 focus:ring-orange/40 transition">
        <button id="clr" aria-label="Clear URL" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink/60 hover:text-ink p-1 hidden">
          <i class="ti ti-x text-xl"></i>
        </button>
      </div>
      <button class="pbtn bg-yellow border-[3px] border-ink rounded-[12px] px-4 font-black shadow-brutal-sm hover:-translate-y-1 hover:shadow-brutal transition flex items-center gap-2" id="pbtn" aria-label="Paste from clipboard">
        <i class="ti ti-clipboard text-lg"></i> Paste
      </button>
    </div>
    <button class="fbtn w-full bg-orange border-[3px] border-ink rounded-[12px] py-3.5 px-4 font-black text-ink shadow-brutal hover:-translate-y-1 hover:shadow-brutal-lg transition flex items-center justify-center gap-2" id="fbtn">
      <i class="ti ti-search text-lg"></i> Fetch video
    </button>
    
    <div class="ebox mt-4 p-3.5 bg-pink border-[3px] border-ink rounded-[12px] text-ink font-black flex items-start gap-2 hidden" id="ebox" role="alert">
      <i class="ti ti-alert-triangle text-lg mt-0.5"></i>
      <span id="emsg"></span>
    </div>
  </div>

  <!-- Result Container -->
  <div class="card rc w-full max-w-xl bg-cream border-[3px] border-ink rounded-[20px] shadow-brutal-lg overflow-hidden hidden mb-6 rotate-[-1deg] hover:rotate-0 transition-transform duration-300" id="rc"></div>

  <!-- Footer -->
  <p class="foot max-w-md text-center text-xs font-extrabold text-ink/60 leading-relaxed mt-6">
    Built with <span class="text-purple">♥</span> by Shrine<br>
    © 2026
  </p>
</div>

<script>
(function(){
const root=document.documentElement;
const themeBtn=document.getElementById('themeBtn');
const themeIcon=document.getElementById('themeIcon');

function applyTheme(dark){
  root.classList.toggle('dark',dark);
  themeIcon.className=dark?'ti ti-sun':'ti ti-moon';
}

const saved=localStorage.getItem('theme');
const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(saved?saved==='dark':prefersDark);

themeBtn.addEventListener('click',()=>{
  const isDark=!root.classList.contains('dark');
  applyTheme(isDark);
  localStorage.setItem('theme',isDark?'dark':'light');
});
})();
</script>
<script>
(function(){
const G=id=>document.getElementById(id);
const urlIn=G('url'),clrBtn=G('clr'),pstBtn=G('pbtn'),fchBtn=G('fbtn'),ebox=G('ebox'),emsg=G('emsg'),rc=G('rc');
let vars=[],selQ=0,tid='',vidDuration=0,tslug='';

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function slugify(text,author){
  let base=(text||'').trim();
  // Strip URLs (t.co links etc.) and line breaks — they add no value to a filename
  base=base.replace(/https?:\/\/\S+/g,'').replace(/[\r\n]+/g,' ').trim();
  if(!base&&author)base=author;
  if(!base)return'';
  // Keep it filesystem-safe across Windows/macOS/Linux
  base=base.replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_').replace(/_+/g,'_');
  base=base.replace(/^_+|_+$/g,'');
  return base.slice(0,60);
}

function fmtD(s){
  if(!s)return'';
  const m=Math.floor(s/60),sec=Math.floor(s%60);
  return m+':'+String(sec).padStart(2,'0');
}

function fmtN(n){
  if(n==null)return'0';
  return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n);
}

function dimsFromUrl(url){
  const m=(url||'').match(/\/(\d{3,5})x(\d{3,5})\//);
  if(!m)return null;
  return{w:parseInt(m[1]),h:parseInt(m[2])};
}

function qlbl(v){
  const d=dimsFromUrl(v.url);
  if(d){
    return Math.min(d.w,d.h)+'p';
  }
  const b=v.bitrate||0;
  return b>=2176000?'1080p':b>=832000?'720p':b>=432000?'480p':'360p';
}

function resDims(v){
  const d=dimsFromUrl(v.url);
  if(d)return d.w+'×'+d.h;
  return null;
}


function parseUrl(raw){
  raw=(raw||'').trim();
  const m=raw.match(/(?:twitter\.com|x\.com)\/(?:#!\/)?(\w+)\/status(?:es)?\/(\d+)/i);
  if(m)return{u:m[1],id:m[2]};
  if(/^\d{15,}$/.test(raw))return{u:'i',id:raw};
  return null;
}

function showErr(msg){emsg.textContent=msg;ebox.classList.remove('hidden');ebox.style.display='flex'}
function hideErr(){ebox.classList.add('hidden');ebox.style.display='none'}

urlIn.addEventListener('input',()=>{clrBtn.style.display=urlIn.value?'flex':'none'});
urlIn.addEventListener('keydown',e=>{if(e.key==='Enter')doFetch()});
clrBtn.addEventListener('click',()=>{urlIn.value='';clrBtn.style.display='none';hideErr();rc.style.display='none';urlIn.focus()});
pstBtn.addEventListener('click',async()=>{
  try{const t=await navigator.clipboard.readText();if(t){urlIn.value=t;clrBtn.style.display='flex';doFetch()}}
  catch{urlIn.focus()}
});
fchBtn.addEventListener('click',doFetch);

async function doFetch(){
  const info=parseUrl(urlIn.value);
  if(!info){showErr('Please enter a valid Twitter / X post URL');return}
  hideErr();rc.style.display='none';
  fchBtn.disabled=true;fchBtn.innerHTML='<span class="spin"></span> Fetching...';
  try{
    const r=await fetch(`https://api.fxtwitter.com/${info.u}/status/${info.id}`);
    const d=await r.json();
    if(d.code===401||d.code===403)throw new Error("Private account — can't fetch without authentication");
    if(d.code===404)throw new Error('Post not found or deleted');
    if(d.code!==200)throw new Error(d.message||`API error ${d.code}`);
    const t=d.tweet;
    if(!t.media?.videos?.length){
      if(t.media?.photos?.length)throw new Error('Images only — no video in this tweet');
      throw new Error('No video found in this tweet');
    }
    const v=t.media.videos[0];
    vidDuration=v.duration||0;
    let rv=v.variants||[];
    if(!rv.length&&v.url)rv=[{url:v.url,content_type:'video/mp4',bitrate:0}];
    vars=rv.filter(x=>!x.content_type||x.content_type==='video/mp4')
           .sort((a,b)=>(b.bitrate||0)-(a.bitrate||0));
    selQ=0;tid=t.id||Date.now();
    tslug=slugify(t.text,t.author?.screen_name);
    renderResult(t,v);
  }catch(e){showErr(e.message)}
  finally{fchBtn.disabled=false;fchBtn.innerHTML='<i class="ti ti-search text-lg"></i> Fetch video'}
}

function renderResult(t,v){
  const sens=t.possibly_sensitive||t.sensitive;
  const isGif=(v.url||'').includes('tweet_video');
  const multi=t.media.videos.length>1;

  const topRes=v.width&&v.height?v.width+'×'+v.height:null;
  const codec=(vars[0]?.url||'').includes('avc1')?'H.264':(vars[0]?.url||'').includes('hevc')?'HEVC':'MP4';

  const pillsHtml=vars.map((vr,i)=>{
    const label=qlbl(vr);
    const dims=resDims(vr);
    const star=i===0?'★ ':'';
    const meta=[dims,'<span id="sz-'+i+'">…</span>'].filter(Boolean).join(' · ');
    return`<button class="qp${i===0?' act':''}" data-i="${i}">
      <span class="qp-top text-sm flex items-center gap-1">${star}${label}</span>
      <span class="qp-bot">${meta}</span>
    </button>`;
  }).join('');

  rc.innerHTML=`
    <!-- Author Row -->
    <div class="p-5 flex items-center gap-4 border-b-[3px] border-ink">
      ${t.author?.avatar_url
        ?`<img class="w-12 h-12 rounded-full border-[3px] border-ink shadow-brutal-sm object-cover" src="${esc(t.author.avatar_url)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="w-12 h-12 rounded-full border-[3px] border-ink shadow-brutal-sm bg-purple text-cream flex items-center justify-center" style="display:none"><i class="ti ti-user text-xl"></i></div>`
        :`<div class="w-12 h-12 rounded-full border-[3px] border-ink shadow-brutal-sm bg-purple text-cream flex items-center justify-center"><i class="ti ti-user text-xl"></i></div>`}
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap font-black text-lg tracking-[-0.035em]">
          ${esc(t.author?.name)}
          ${t.author?.verified?'<i class="ti ti-circle-check-filled text-blue text-xl" aria-label="Verified"></i>':''}
          ${sens?'<span class="bg-pink border-[2px] border-ink text-ink text-xs font-black px-2 py-0.5 rounded-full">NSFW</span>':''}
          ${isGif?'<span class="bg-yellow border-[2px] border-ink text-ink text-xs font-black px-2 py-0.5 rounded-full">GIF</span>':''}
        </div>
        <div class="font-extrabold text-ink/60 text-sm mt-0.5">@${esc(t.author?.screen_name)}</div>
      </div>
      <a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" class="bg-yellow border-[2px] border-ink rounded-[10px] px-3 py-1.5 font-black text-xs shadow-brutal-sm hover:-translate-y-1 transition flex items-center gap-1">
        Open <i class="ti ti-external-link text-sm"></i>
      </a>
    </div>
    
    ${multi?`<div style="padding:9px 20px;border-bottom:3px solid #111111;font-size:12px;font-weight:800;color:rgba(17,17,17,0.7)" class="flex items-center gap-2"><i class="ti ti-info-circle text-lg"></i> ${t.media.videos.length} videos in this post — showing the first one</div>`:''}
    
    ${t.text?`<div class="ttext p-5 border-b-[3px] border-ink font-bold text-ink/80 leading-relaxed text-sm">${esc(t.text)}</div>`:''}
    
    <!-- Desktop Window Motif -->
    ${v.thumbnail_url?`
    <div class="bg-cream border-b-[3px] border-ink">
      <div class="flex items-center gap-2 px-5 py-3 border-b-[3px] border-ink bg-purple">
        <span class="w-4 h-4 rounded-full border-2 border-ink bg-orange"></span>
        <span class="w-4 h-4 rounded-full border-2 border-ink bg-yellow"></span>
        <span class="w-4 h-4 rounded-full border-2 border-ink bg-mint"></span>
        <span class="ml-auto bg-cream border-2 border-ink rounded-md px-3 py-1 text-[0.7rem] font-black uppercase tracking-tight" style="color:#111111">Video.mp4</span>
      </div>
      <div class="relative bg-ink overflow-hidden flex items-center justify-center max-h-[400px]" id="playerWrap">
        <img class="w-full max-h-[400px] object-contain opacity-90" src="${esc(v.thumbnail_url)}" alt="Video thumbnail" onerror="this.parentElement.style.display='none'" id="thumbImg">
        <div class="absolute inset-0 flex items-center justify-center cursor-pointer" id="playOverlay">
          <div class="w-16 h-16 rounded-full bg-cream border-[3px] border-ink shadow-brutal-sm flex items-center justify-center text-2xl transition hover:-translate-y-1" style="color:#111111">
            <i class="ti ti-player-play-filled"></i>
          </div>
        </div>
        ${v.duration?`<div class="absolute bottom-3 right-3 bg-ink text-cream border-2 border-cream rounded-md px-2 py-1 text-xs font-black flex items-center gap-1" id="durBadge"><i class="ti ti-clock text-sm"></i> ${fmtD(v.duration)}</div>`:''}
        ${topRes?`<div class="absolute bottom-3 left-3 bg-ink text-cream border-2 border-cream rounded-md px-2 py-1 text-xs font-black flex items-center gap-1" id="resBadge"><i class="ti ti-maximize text-sm"></i> ${topRes}</div>`:''}
      </div>
    </div>`:''}
    
    <!-- Meta Data Strip -->
    <div class="p-5 border-b-[3px] border-ink bg-yellow/20 flex flex-wrap gap-4">
      ${topRes?`<span class="flex items-center gap-2 font-black text-sm"><i class="ti ti-maximize text-lg"></i> ${topRes}</span>`:''}
      ${vidDuration?`<span class="flex items-center gap-2 font-black text-sm"><i class="ti ti-clock text-lg"></i> ${fmtD(vidDuration)}</span>`:''}
      <span class="flex items-center gap-2 font-black text-sm"><i class="ti ti-database text-lg"></i> <span id="sz-top">…</span></span>
      <span class="flex items-center gap-2 font-black text-sm"><i class="ti ti-file-type-mp4 text-lg"></i> ${codec}</span>
    </div>
    
    <!-- Stats -->
    <div class="p-5 border-b-[3px] border-ink flex flex-wrap gap-5">
      <span class="flex items-center gap-2 font-black text-sm text-ink/80"><i class="ti ti-heart text-pink text-lg"></i> ${fmtN(t.likes)} likes</span>
      <span class="flex items-center gap-2 font-black text-sm text-ink/80"><i class="ti ti-repeat text-mint text-lg"></i> ${fmtN(t.retweets)} retweets</span>
      <span class="flex items-center gap-2 font-black text-sm text-ink/80"><i class="ti ti-message-circle-2 text-blue text-lg"></i> ${fmtN(t.replies)} replies</span>
    </div>
    
    <!-- Download Area -->
    <div class="p-5">
      ${vars.length>1?`<div class="font-black text-xs uppercase tracking-wider mb-3">Select quality</div>`:''}
      <div class="flex flex-wrap gap-3 mb-5">${pillsHtml}</div>
      <button class="w-full bg-orange border-[3px] border-ink rounded-[12px] py-3.5 px-4 font-black text-ink shadow-brutal hover:-translate-y-1 hover:shadow-brutal-lg transition flex items-center justify-center gap-2" id="dbtn">
        <i class="ti ti-download text-xl"></i> Download ${qlbl(vars[0])} MP4
      </button>
      <div class="pbar-wrap mt-3 hidden" id="pbarWrap">
        <div class="w-full h-4 bg-cream border-[3px] border-ink rounded-full overflow-hidden">
          <div class="h-full bg-purple transition-all duration-150" id="pbar" style="width:0%"></div>
        </div>
        <div class="flex justify-between mt-1.5">
          <span class="text-xs font-black text-ink/70" id="pbarPct">0%</span>
          <span class="text-xs font-black text-ink/70" id="pbarSize"></span>
        </div>
      </div>
      <div class="dtip text-xs font-bold text-ink/70 text-center mt-3 hidden" id="dtip"></div>
    </div>
  `;
  rc.style.display='block';
  rc.classList.remove('fi');void rc.offsetWidth;rc.classList.add('fi');

  document.querySelectorAll('.qp').forEach(p=>{
    p.onclick=()=>{
      selQ=parseInt(p.dataset.i);
      document.querySelectorAll('.qp').forEach(x=>x.classList.remove('act'));
      p.classList.add('act');
      resetDlBtn();
    }
  });
  G('dbtn').onclick=doDownload;

  // Fetch real file sizes (HEAD request via proxy) instead of estimating
  vars.forEach((vr,i)=>{
    const setTxt=(txt)=>{
      const el=document.getElementById('sz-'+i);
      if(el)el.textContent=txt;
      if(i===0){const top=document.getElementById('sz-top');if(top)top.textContent=txt}
    };
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8000);
    fetch(`/api/filesize?url=${encodeURIComponent(vr.url)}`,{signal:controller.signal})
      .then(r=>{clearTimeout(timer);return r.ok?r.json():Promise.reject()})
      .then(d=>{
        if(d&&d.size){setTxt(fmtBytes(d.size))}
        else{setTxt('—')}
      })
      .catch(()=>{clearTimeout(timer);setTxt('—')});
  });

  const playOverlay=G('playOverlay');
  if(playOverlay){
    playOverlay.onclick=()=>{
      const wrap=G('playerWrap'),thumb=G('thumbImg');
      const playUrl=(vars[0]||v).url||v.url;
      const vid=document.createElement('video');
      vid.className='w-full max-h-[400px] object-contain';
      vid.src=playUrl;
      vid.controls=true;
      vid.autoplay=true;
      vid.playsInline=true;
      vid.setAttribute('referrerpolicy','no-referrer');
      vid.poster=v.thumbnail_url||'';
      vid.onerror=()=>{
        // Playback blocked — fall back to opening the video directly
        window.open(playUrl,'_blank','noopener,noreferrer');
      };
      wrap.innerHTML='';
      wrap.appendChild(vid);
    };
  }
}

function resetDlBtn(){
  const db=G('dbtn');if(!db)return;
  db.className='w-full bg-orange border-[3px] border-ink rounded-[12px] py-3.5 px-4 font-black text-ink shadow-brutal hover:-translate-y-1 hover:shadow-brutal-lg transition flex items-center justify-center gap-2';
  db.innerHTML=`<i class="ti ti-download text-xl"></i> Download ${qlbl(vars[selQ])} MP4`;
  db.onclick=doDownload;
  const dt=G('dtip');if(dt)dt.classList.add('hidden');
  const pw=G('pbarWrap');if(pw)pw.classList.add('hidden');
  const pb=G('pbar');if(pb)pb.style.width='0%';
  const pp=G('pbarPct');if(pp)pp.textContent='0%';
  const ps=G('pbarSize');if(ps)ps.textContent='';
}

function fmtBytes(n){
  if(n>=1048576)return(n/1048576).toFixed(1)+' MB';
  if(n>=1024)return(n/1024).toFixed(0)+' KB';
  return n+' B';
}

function doDownload(){
  const vr=vars[selQ];if(!vr)return;
  const db=G('dbtn'),dt=G('dtip'),pw=G('pbarWrap'),pb=G('pbar'),pp=G('pbarPct'),ps=G('pbarSize');
  db.className='w-full bg-purple border-[3px] border-ink rounded-[12px] py-3.5 px-4 font-black text-cream shadow-brutal transition flex items-center justify-center gap-2';
  db.innerHTML='<span class="spin"></span> Downloading...';
  if(dt)dt.classList.add('hidden');
  if(pw){pw.classList.remove('hidden');pb.style.width='0%';pp.textContent='0%';ps.textContent=''}

  const fname=`${tslug||'x_'+tid}_${qlbl(vr)}.mp4`;

  // Route through our own serverless proxy so video.twimg.com sees a
  // server-to-server request instead of a browser request from a
  // vercel.app referrer (which it 403s).
  fetch(`/api/download?url=${encodeURIComponent(vr.url)}&filename=${encodeURIComponent(fname)}`)
    .then(async r=>{
      if(!r.ok)throw 0;
      const total=parseInt(r.headers.get('Content-Length')||'0',10);
      if(!r.body||!total){
        return r.blob();
      }
      const reader=r.body.getReader();
      const chunks=[];
      let received=0;
      while(true){
        const {done,value}=await reader.read();
        if(done)break;
        chunks.push(value);
        received+=value.length;
        const pct=Math.min(100,Math.round((received/total)*100));
        if(pb)pb.style.width=pct+'%';
        if(pp)pp.textContent=pct+'%';
        if(ps)ps.textContent=`${fmtBytes(received)} / ${fmtBytes(total)}`;
      }
      return new Blob(chunks,{type:'video/mp4'});
    })
    .then(blob=>{
      if(pb)pb.style.width='100%';
      if(pp)pp.textContent='100%';
      const u=URL.createObjectURL(blob);
      const a=Object.assign(document.createElement('a'),{href:u,download:fname});
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(u),2000);
      db.className='w-full bg-mint border-[3px] border-ink rounded-[12px] py-3.5 px-4 font-black text-ink shadow-brutal hover:-translate-y-1 hover:shadow-brutal-lg transition flex items-center justify-center gap-2';
      db.innerHTML='<i class="ti ti-check text-xl"></i> Finished!';
    })
    .catch(()=>{
      // Fallback: open in new tab directly
      const a=document.createElement('a');
      a.href=vr.url;
      a.target='_blank';
      a.rel='noopener noreferrer';
      a.referrerPolicy='no-referrer';
      document.body.appendChild(a);a.click();document.body.removeChild(a);

      db.className='w-full bg-blue border-[3px] border-ink rounded-[12px] py-3.5 px-4 font-black text-ink shadow-brutal hover:-translate-y-1 hover:shadow-brutal-lg transition flex items-center justify-center gap-2';
      db.innerHTML='<i class="ti ti-external-link text-xl"></i> Opened in new tab';
      if(dt){dt.textContent='Right-click the video in the new tab → "Save video as…" to save it.';dt.classList.remove('hidden')}
      if(pw)pw.classList.add('hidden');
    })
    .finally(()=>{setTimeout(()=>resetDlBtn(),4500)});
}
})();
</script>
